services:
  db:
    image: postgres:17-alpine
    container_name: buildflow-postgres
    environment:
      POSTGRES_DB: buildflow
      POSTGRES_USER: buildflow
      POSTGRES_PASSWORD: buildflow_dev
    ports:
      - "5432:5432"
    volumes:
      - buildflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildflow -d buildflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    
  pgadmin:
    container_name: buildflow-web
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: nomail@nomail.ru
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"

volumes:
  buildflow_data:
