
spring:
  application:
    name: buildflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/buildflow}
    username: ${DB_USERNAME:buildflow}
    password: ${DB_PASSWORD:buildflow_dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.buildflow: DEBUG
